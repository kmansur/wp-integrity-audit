[smtp]
# Utilize um nome DNS compatível com o certificado TLS apresentado pelo servidor.
host = smtp.example.com
port = 587
security = starttls
from_address = audits@example.com
username = audits@example.com
# Caminho absoluto do arquivo com a senha SMTP; permissões exclusivas do proprietário (0600).
password_file = /etc/wp-integrity-audit/smtp-password
